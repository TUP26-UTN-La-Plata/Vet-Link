<aside
  class="hidden h-full min-h-0 w-48 shrink-0 flex-col items-start justify-between border-r-2 border-neutral/20 bg-main md:flex">
  <div class="flex w-full items-center justify-center">
    <img src="/logo.png" alt="Vet-Link" class="max-h-32 max-w-32" />
  </div>
  <div class="my-4 flex h-full w-full flex-col items-start justify-start pr-2">
    <app-nav-button [label]="'Pacientes'" [icon]="'pi pi-heart'" [routerLink]="'/patients'" />
    <app-nav-button [label]="'Configuración'" [icon]="'pi pi-cog'" [routerLink]="'/settings'" />
  </div>
  <p class="h-8 w-full px-4 text-end text-sm text-muted">Versión 0.1.1</p>
</aside>

<div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden bg-card">
  <app-layout-header />
  <div
    class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden bg-main px-4 py-6 pb-[calc(4rem+env(safe-area-inset-bottom,0))] md:px-8 md:pb-8">
    <router-outlet />
  </div>
</div>

<div class="fixed bottom-0 left-0 right-0 z-20 md:hidden">
  <div class="border-t-2 border-neutral/20 bg-card">
    <div class="relative h-16">
      <p
        class="pointer-events-none absolute right-1 -top-2 z-30 -translate-y-1/2 text-[11px] leading-none text-muted">
        Versión 0.1.1
      </p>
      <nav
        class="layout-bottom-nav relative z-10 flex h-full shrink-0 items-stretch gap-0"
        aria-label="Navegación principal">
        <app-nav-button
          variant="bottom"
          [label]="'Pacientes'"
          [icon]="'pi pi-heart'"
          [routerLink]="'/patients'" />
        <app-nav-button
          variant="bottom"
          [label]="'Configuración'"
          [icon]="'pi pi-cog'"
          [routerLink]="'/settings'" />
      </nav>
    </div>
    <div class="min-h-[env(safe-area-inset-bottom,0)] bg-card" aria-hidden="true"></div>
  </div>
</div>
