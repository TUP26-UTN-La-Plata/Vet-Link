@if (visible) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" aria-live="polite">
    <div
      class="absolute inset-0 cursor-default bg-black/40 backdrop-blur-sm"
      aria-hidden="true"
      (click)="onBackdropClick()"></div>
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="messageId"
      class="relative z-10 flex w-full max-w-md flex-col gap-6 rounded-xl bg-card p-6 shadow-lg">
      <div class="flex flex-col gap-4">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-danger/15 text-danger"
          aria-hidden="true">
          <i [class]="iconClass + ' text-xl leading-none'"></i>
        </div>
        <div class="flex min-w-0 flex-col gap-2">
          <h2 [id]="titleId" class="text-lg font-bold leading-snug text-base-content">
            {{ title }}
          </h2>
          <p [id]="messageId" class="text-sm leading-relaxed text-base-content">
            {{ message }}
          </p>
        </div>
      </div>
      <div class="flex shrink-0 flex-wrap justify-end gap-3">
        <app-action-button [label]="cancelLabel" variant="gray" (clicked)="onCancel()" />
        <app-action-button [label]="confirmLabel" variant="danger" (clicked)="onConfirm()" />
      </div>
    </div>
  </div>
}
