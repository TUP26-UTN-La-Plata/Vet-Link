      <img src="/avatar.webp" alt="Avatar" class="h-16 w-16 rounded-full">
    </div>
    <div class="flex flex-col justify-center items-start w-full">
      <h4>Dr. Alejandro Méndez</h4>
      <div class="flex flex-row justify-start items-center gap-2">
        <i class="pi pi-pencil" ></i>
        <p>Veterinario</p>

    </div>
    <div class="flex justify-center items-start w-72">
      <app-action-button
        label="Editar perfil"
        icon="pi pi-pencil"
        variant="gray"
        (clicked)="onEditProfile()"
        class="w-full pointer-fine:"
      />

  <div class="flex flex-1 flex-col items-start justify-evenly p-4 min-h-0">
    <p class="text-sm text-muted">Clinica Veterinaria "El Socorro"</p>
