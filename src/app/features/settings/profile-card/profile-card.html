<div class="flex h-full min-h-0 w-full flex-col rounded-xl bg-card shadow-md">
  <div class="flex w-full flex-row justify-between gap-4 border-b-2 border-neutral/20 p-4 pb-4">
    <div class="flex justify-center items-center w-32">
      <img
        [src]="authService.getUserData()?.photoURL || '/avatar.webp'"
        alt="Avatar"
        class="h-16 w-16 rounded-full"
        (error)="$event.target.src = '/avatar.webp'" />
    </div>
    <div class="flex flex-col justify-center items-start w-full">
      <h4>
        {{ authService.getUserData()?.name || authService.getUserData()?.email || 'Usuario' }}
      </h4>
      @if (authService.getUserData()?.email) {
        <p class="text-sm text-muted">
          {{ authService.getUserData()?.email }}
        </p>
      } @else {
        <p class="text-sm text-muted">Usuario conectado</p>
      }
    </div>
    <div class="flex justify-center items-start w-72">
      <app-action-button
        label="Editar perfil"
        icon="pi pi-pencil"
        variant="gray"
        (clicked)="onEditProfile()"
        class="w-full pointer-fine:" />
    </div>
  </div>
  <div class="flex flex-1 flex-col items-start justify-evenly p-4 min-h-0">
    <p class="text-sm text-muted">Clinica Veterinaria "El Socorro"</p>
    <p class="text-sm text-muted">San Miguel de Tucuman, Tucuman, Argentina</p>
    <p class="text-sm text-muted">11-1111-1111</p>
  </div>
</div>
