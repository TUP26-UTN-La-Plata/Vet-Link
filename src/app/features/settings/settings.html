<ng-container *transloco="let t; prefix: 'settings'">
  <div class="flex flex-col gap-4">
    <div>
      <h1>{{ t('title') }}</h1>
      <p>{{ t('description') }}</p>
    </div>
    <div class="grid w-full grid-cols-1 gap-16 lg:grid-cols-[minmax(0,3fr)_minmax(0,2fr)] lg:items-stretch">
      <app-profile-card class="min-w-0" />
      <app-user-agent-card class="min-w-0" />
    </div>
    <app-settings-card (logoutRequested)="onLogoutRequested()" />
    <app-confirm-modal [visible]="logoutModalOpen" [title]="t('logout.title')" [message]="t('logout.message')"
      [cancelLabel]="t('logout.cancel')" [confirmLabel]="t('logout.confirm')" (confirmed)="onLogoutConfirm()"
      (cancelled)="onLogoutCancel()" />
  </div>
</ng-container>
