name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase_preview
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VET_LINK_859A3 }}
          projectId: vet-link-859a3

      - name: Run Lighthouse CI on Firebase Preview URL
        env:
          LIGHTHOUSE_URL: ${{ steps.firebase_preview.outputs.details_url }}
        run: npm run lhci